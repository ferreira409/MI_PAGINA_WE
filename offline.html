<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#00843d">
    <title>Sin conexión | AgendaFácil</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif;
               background: linear-gradient(180deg, #00843d 0 33.33%, #fff 33.33% 66.66%, #00843d 66.66%); color: #0f172a; }
        .caja { background: #fff; padding: 36px 30px; border-radius: 18px; max-width: 360px; margin: 16px; text-align: center;
                box-shadow: 0 24px 50px rgba(0, 50, 25, .25); }
        img { width: 72px; height: 72px; }
        h1 { font-size: 1.4rem; margin: 14px 0 6px; }
        p { color: #64748b; line-height: 1.5; }
        button { margin-top: 12px; padding: 12px 22px; border: 0; border-radius: 8px; background: #00843d; color: #fff;
                 font-weight: 600; font-size: 1rem; cursor: pointer; }
    </style>
</head>
<body>
    <div class="caja">
        <img src="assets/iconos/icono-192.png" alt="">
        <h1>Sin conexión a internet</h1>
        <p>Revisá tu conexión. Tus citas siguen guardadas; cuando vuelvas a estar en línea podrás verlas.</p>
        <button onclick="location.reload()">Reintentar</button>
    </div>
</body>
</html>
